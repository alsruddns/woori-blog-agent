[project]
name = "woori-blog-agent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.8,<3", "langcodes>=3.5,<4", "language-data>=1.3,<2", "croniter>=6,<7", "httpx>=0.28,<1", "cryptography>=46,<49", "psutil>=7,<8"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-croniter>=6,<7", "httpx2>=2,<3", "types-psutil>=7,<8"]
[tool.pytest.ini_options]
pythonpath = ["services/api"]
testpaths = ["services/api/tests"]
[tool.ruff]
line-length = 100
[tool.mypy]
mypy_path = "services/api"
strict = true
plugins = ["pydantic.mypy"]
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["services/api"]
include = ["woori*"]
